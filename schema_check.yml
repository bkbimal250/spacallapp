openapi: 3.0.3
info:
  title: CallLog System API
  version: 1.0.0
  description: Comprehensive API documentation for the CallLog System. Managed call
    logs, branches, devices, and lead management.
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/calls/:
    get:
      operationId: analytics_calls_retrieve
      description: Returns daily call volume counts and type breakdown over time.
      summary: Get call volume trends
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by branch ID
      - in: query
        name: end_date
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: start_date
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: time_filter
        schema:
          type: string
        description: Range filter
      tags:
      - analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAnalyticsResponse'
          description: ''
  /api/v1/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      description: Returns call counts grouped by type (incoming, outgoing, missed,
        rejected) for the selected range.
      summary: Get call type distribution
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by branch ID
      - in: query
        name: call_type
        schema:
          type: string
        description: 'Filter by call type: incoming, outgoing, missed, rejected'
      - in: query
        name: end_date
        schema:
          type: string
        description: 'Format: YYYY-MM-DD'
      - in: query
        name: start_date
        schema:
          type: string
        description: 'Format: YYYY-MM-DD'
      - in: query
        name: time_filter
        schema:
          type: string
        description: 'Range filter: today, yesterday, last_7_days, last_30_days, this_month,
          custom'
      tags:
      - analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'
          description: ''
  /api/v1/analytics/peak-hours/:
    get:
      operationId: analytics_peak_hours_list
      description: Returns a 24-hour breakdown of call counts to identify peak hours.
      summary: Get hourly call volume
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by branch ID
      - in: query
        name: call_type
        schema:
          type: string
        description: Filter by call type
      - in: query
        name: end_date
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: start_date
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: time_filter
        schema:
          type: string
        description: Range filter
      tags:
      - analytics
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeakHoursResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates a user via email and password, returning JWT tokens
        and profile data.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: ''
  /api/v1/auth/login-history/:
    get:
      operationId: auth_login_history_list
      description: |-
        Viewset to see login history.
        Admin/SuperAdmin can see all logs.
        Branch Manager can only see their own logs (optionally).
      summary: List Login History
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
        description: Filter history by user UUID
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserLoginHistoryList'
          description: ''
  /api/v1/auth/login-history/{id}/:
    get:
      operationId: auth_login_history_retrieve
      description: |-
        Viewset to see login history.
        Admin/SuperAdmin can see all logs.
        Branch Manager can only see their own logs (optionally).
      summary: Retrieve Login History Item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User Login History.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginHistory'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: Sends a one-time password (OTP) to the provided email address if
        the user exists.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestSuccess'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestError'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Verifies the OTP sent to the email and returns JWT tokens if valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyError'
          description: ''
  /api/v1/auth/profile/:
    patch:
      operationId: auth_profile_partial_update
      description: Updates the profile of the currently logged-in user. Used for FCM
        token registration.
      summary: Update Current User Profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequestRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: auth_users_list
      description: List all users with search and filtering for roles and branches.
      summary: List Users
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Filter by branch UUID
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by active status
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
        description: Filter by user role
      - in: query
        name: search
        schema:
          type: string
        description: Search by name or email
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: auth_users_create
      description: |-
        CRUD for User management.

        Access Rules:
            - Only admin and super_admin can access this viewset.
            - A super_admin can create/manage users of any role.
            - An admin can create spa_manager users and assign branches.
            - Admin cannot create other admins or super_admins
              (enforced via serializer or can be added here).

        Filters:
            ?search=<name_or_email>   → Search by email or full name.
            ?role=<role>              → Filter by role.
            ?branch=<branch_uuid>     → Filter by assigned branch.
            ?is_active=true|false     → Filter by active status.
      summary: Create User
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/{id}/:
