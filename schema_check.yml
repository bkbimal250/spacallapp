          type: string
          format: uuid
        description: A UUID string identifying this User.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/users/online/:
    get:
      operationId: auth_users_online_list
      description: Returns a list of users currently marked as online.
      summary: List Online Users
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnlineUserListItem'
          description: ''
  /api/v1/branches/:
    get:
      operationId: branches_list
      description: List branches with role-based caching.
      summary: List Branches
      parameters:
      - in: query
        name: all
        schema:
          type: boolean
        description: Set to true to disable pagination
      - in: query
        name: city
        schema:
          type: string
        description: Filter by city
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End Date (YYYY-MM-DD)
      - in: query
        name: group
        schema:
          type: string
        description: Filter by branch group UUID
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: quick_date
        schema:
          type: string
        description: 'Preset: today, yesterday'
      - in: query
        name: search
        schema:
          type: string
        description: Search by spa name or branch code
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start Date (YYYY-MM-DD)
      - in: query
        name: state
        schema:
          type: string
        description: Filter by state
      - in: query
        name: status
        schema:
          type: boolean
        description: Filter by active status
      tags:
      - branches
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchListList'
          description: ''
    post:
      operationId: branches_create
      description: |-
        CRUD for Branch (Spa locations).

        Access:
            All authenticated users can list/read branches.
            Only admin and super_admin can create/update/delete.
            Branch managers only see their own assigned branch.
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/branches/{id}/:
    get:
      operationId: branches_retrieve
      description: |-
        CRUD for Branch (Spa locations).

        Access:
            All authenticated users can list/read branches.
            Only admin and super_admin can create/update/delete.
            Branch managers only see their own assigned branch.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Branch.
        required: true
      tags:
      - branches
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    put:
      operationId: branches_update
      description: |-
        CRUD for Branch (Spa locations).

        Access:
            All authenticated users can list/read branches.
            Only admin and super_admin can create/update/delete.
            Branch managers only see their own assigned branch.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Branch.
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
