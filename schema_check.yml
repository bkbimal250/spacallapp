components:
  schemas:
    AnalyticsOverviewResponse:
      type: object
      properties:
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/CallTypeStat'
      required:
      - distribution
    AssignBranchesRequestRequest:
      type: object
      properties:
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - branch_ids
    AssignBranchesResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    BatchLeadSyncRequestRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
        call_hash:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        remarks:
          type: string
          minLength: 1
        booking_date:
          type: string
          format: date
      required:
      - phone_number
    BatchLeadSyncResponse:
      type: object
      properties:
        status:
          type: string
        synced_count:
          type: integer
      required:
      - status
      - synced_count
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch_group_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_deleted:
          type: boolean
        spa_name:
          type: string
          description: Full name of the Spa location.
          maxLength: 255
        code:
          type: string
          description: Unique short code identifying this branch (e.g. 'SPA-001').
          maxLength: 20
        state:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        area:
          type: string
          maxLength: 100
        postal_code:
          type: integer
          maximum: 2147483647
          minimum: 0
        address:
          type: string
        phone:
          type: string
          nullable: true
          description: Branch contact phone number.
          maxLength: 20
        is_active:
          type: boolean
        branch_group:
          type: string
          format: uuid
          nullable: true
          description: Each branch belongs to only one group
      required:
      - address
      - branch_group_name
      - city
      - code
      - created_at
      - id
      - postal_code
      - spa_name
      - state
      - updated_at
    BranchGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_deleted:
          type: boolean
        name:
          type: string
