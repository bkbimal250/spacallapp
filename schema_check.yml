              (enforced via serializer or can be added here).

        Filters:
            ?search=<name_or_email>   → Search by email or full name.
            ?role=<role>              → Filter by role.
            ?branch=<branch_uuid>     → Filter by assigned branch.
            ?is_active=true|false     → Filter by active status.
      summary: Retrieve User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_users_update
      description: |-
        CRUD for User management.

        Access Rules:
            - Only admin and super_admin can access this viewset.
            - A super_admin can create/manage users of any role.
            - An admin can create spa_manager users and assign branches.
            - Admin cannot create other admins or super_admins
              (enforced via serializer or can be added here).

        Filters:
            ?search=<name_or_email>   → Search by email or full name.
            ?role=<role>              → Filter by role.
            ?branch=<branch_uuid>     → Filter by assigned branch.
            ?is_active=true|false     → Filter by active status.
      summary: Update User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_users_partial_update
      description: |-
        CRUD for User management.

        Access Rules:
            - Only admin and super_admin can access this viewset.
            - A super_admin can create/manage users of any role.
            - An admin can create spa_manager users and assign branches.
            - Admin cannot create other admins or super_admins
              (enforced via serializer or can be added here).

        Filters:
            ?search=<name_or_email>   → Search by email or full name.
            ?role=<role>              → Filter by role.
            ?branch=<branch_uuid>     → Filter by assigned branch.
            ?is_active=true|false     → Filter by active status.
      summary: Partial Update User
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this User.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      - DeviceAuth: []
        X-Device-Secret: []
      responses:
        '200':
          content:
            application/json:
