          format: date
        count:
          type: integer
      required:
      - count
      - date
    UpdateFCMTokenRequestRequest:
      type: object
      properties:
        fcm_token:
          type: string
          minLength: 1
      required:
      - fcm_token
    UpdateFCMTokenResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    UpdateProfileResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    User:
      type: object
      description: |-
        Full user serializer for create, update, and list operations.

        Notes:
            - first_name and last_name are virtual write-only fields that get
