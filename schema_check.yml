          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_role:
          type: string
          readOnly: true
        branch_name:
