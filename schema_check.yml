          type: boolean
          description: Blocked devices are rejected at API auth level.
    PatchedExportJobRequest:
      type: object
      properties:
        export_type:
          type: string
          minLength: 1
          maxLength: 50
        status:
          $ref: '#/components/schemas/ExportJobStatusEnum'
        file_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        file_name:
          type: string
          nullable: true
          maxLength: 255
        error_message:
          type: string
          nullable: true
        user:
          type: string
          format: uuid
    PatchedLeadManagementRequest:
      type: object
      description: Full detail serializer for LeadManagement.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/Status4f2Enum'
          description: |-
            Current follow-up status of this lead.

            * `pending` - Pending
            * `ringing` - Ringing
            * `coming` - Coming
            * `interested` - Interested
            * `not_interested` - Not Interested
        booking_date:
          type: string
          format: date
          nullable: true
          description: Scheduled visit/appointment date. Only used for 'coming' or
            'interested' leads.
        remarks:
          type: string
          nullable: true
          description: Notes from branch manager about follow-up conversation.
        calllog:
          type: string
          format: uuid
          nullable: true
          description: The originating call log for this lead.
        branch:
          type: string
          format: uuid
          nullable: true
          description: The branch this lead belongs to. Auto-set from calllog.branch.
        contact:
          type: string
          format: uuid
          nullable: true
          description: Known contact for this lead (auto-matched from call log's phone
            number).
    PatchedNotificationRequest:
      type: object
      properties:
        device:
          type: string
          format: uuid
          description: The device this notification was sent to.
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
          minLength: 1
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        is_sent:
          type: boolean
        firebase_message_id:
          type: string
          nullable: true
          maxLength: 255
        error_message:
          type: string
          nullable: true
    PatchedUpdateProfileRequestRequest:
      type: object
      properties:
        fcm_token:
          type: string
          minLength: 1
        full_name:
          type: string
          minLength: 1
    PatchedUserRequest:
      type: object
      description: |-
        Full user serializer for create, update, and list operations.

        Notes:
            - first_name and last_name are virtual write-only fields that get
              combined into full_name on save.
            - branch_name is a read-only display field for the assigned branch.
            - Only admin and super_admin users should be able to create/update users.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          writeOnly: true
          minLength: 1
        last_name:
          type: string
          writeOnly: true
          minLength: 1
        role:
          $ref: '#/components/schemas/RoleEnum'
        branch:
          type: string
          format: uuid
          nullable: true
          description: The primary/active branch this user is assigned to.
        is_active:
          type: boolean
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_plain:
          type: string
          nullable: true
          maxLength: 255
    PeakHoursResponse:
      type: object
      properties:
        hour:
          type: string
        calls:
          type: integer
      required:
      - calls
      - hour
    RegenerateTokenResponse:
      type: object
      properties:
        status:
          type: string
        new_token:
          type: string
      required:
      - new_token
      - status
    ResolveAllEventsResponse:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
      required:
      - count
      - status
    ResolveEventResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    RoleEnum:
      enum:
      - super_admin
      - admin
      - spa_manager
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `admin` - Admin
        * `spa_manager` - SPA Manager
    SendNotificationRequestRequest:
      type: object
      properties:
        device_ids:
          type: array
          items:
            type: string
            format: uuid
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
          default: system
      required:
      - body
      - title
    SendNotificationResponse:
      type: object
      properties:
        status:
          type: string
        sent_count:
          type: integer
        total_count:
          type: integer
      required:
      - sent_count
      - status
      - total_count
    SlaStatusEnum:
      enum:
      - GOOD
      - OK
      - LATE
      - MISSED
      type: string
      description: |-
        * `GOOD` - Within 10 mins
        * `OK` - Within 30 mins
        * `LATE` - Within 1 hour
        * `MISSED` - No follow-up / > 1 hour
    Status4f2Enum:
      enum:
      - pending
      - ringing
      - coming
      - interested
      - not_interested
      type: string
      description: |-
        * `pending` - Pending
        * `ringing` - Ringing
        * `coming` - Coming
        * `interested` - Interested
        * `not_interested` - Not Interested
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TrendPoint:
      type: object
      properties:
        name:
          type: string
